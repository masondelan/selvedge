name: Publish to PyPI + create GitHub Release

# Triggers when you push a version tag: git tag v0.2.0 && git push --tags
#
# `workflow_dispatch` exists for one specific failure: the registry publish
# failing *after* PyPI has already succeeded. That happened on v0.3.10 (a
# description over the registry's 100-char cap), and it is unrecoverable by
# re-running the tag — PyPI rejects a re-upload of an existing version, and
# the tag's tree still holds the bad `server.json`. The dispatch path
# re-publishes the registry entry alone, from the default branch, so a fix
# committed to `main` can be shipped without inventing a version number.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already on PyPI to (re-)publish to the MCP Registry, e.g. 0.3.10'
        required: true
        type: string

jobs:
  publish:
    # Tag pushes only. A dispatch is for re-publishing the registry entry for
    # a version PyPI already has, so re-running this would only fail on
    # "file already exists".
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # needed to create GitHub Releases
      id-token: write  # needed for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for changelog generation

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Set version without v-prefix
        id: version
        run: echo "num=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

      - name: Generate changelog from git log
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          name: Selvedge ${{ github.ref_name }}
          body: |
            ## What's changed

            ${{ steps.changelog.outputs.CHANGES }}

            ---

            **Install:** `pip install selvedge==${{ steps.version.outputs.num }}`
            **PyPI:** https://pypi.org/project/selvedge/
            **Docs:** https://github.com/masondelan/selvedge/blob/main/docs/getting-started.md
          files: dist/*
          draft: false
          prerelease: false

  publish-mcp-registry:
    runs-on: ubuntu-latest
    # The registry's ownership check reads the README of the latest release
    # on PyPI, so on a tag push this must only run after the PyPI publish
    # succeeds. On a dispatch the version is already on PyPI by definition,
    # and `publish` is skipped — hence `always()` plus the explicit result
    # check rather than a bare `needs:`.
    needs: publish
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    permissions:
      contents: read
      id-token: write  # OIDC login to the MCP Registry (io.github.masondelan/* namespace)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On dispatch, take the default branch: the whole point is to ship a
          # `server.json` fix that the tag's tree does not have.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "num=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "num=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      # Belt-and-suspenders: server.json carries the version in two places
      # (top-level and packages[0]). The version-bump checklist updates both,
      # but sync them from the tag anyway so a missed bump can't publish a
      # stale version.
      - name: Sync server.json versions
        run: |
          VERSION=${{ steps.v.outputs.num }}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      # PyPI can take a little while to serve a freshly uploaded release, and
      # the registry's ownership check reads pypi.org directly.
      - name: Wait for PyPI to serve the new version
        run: |
          VERSION=${{ steps.v.outputs.num }}
          for i in $(seq 1 30); do
            SERVED=$(curl -s https://pypi.org/pypi/selvedge/json | jq -r .info.version)
            if [ "$SERVED" = "$VERSION" ]; then
              echo "PyPI is serving $VERSION"
              exit 0
            fi
            echo "PyPI is serving $SERVED, waiting for $VERSION ($i/30)"
            sleep 10
          done
          echo "Timed out waiting for PyPI to serve $VERSION" >&2
          exit 1

      # Pinned and checksum-verified. This binary is executed in a job that
      # holds `id-token: write` for the io.github.masondelan/* MCP Registry
      # namespace, and it runs automatically on every tag push with no human
      # in between — so a replaced `releases/latest` asset would have been
      # handed a valid token to publish under our namespace. runs-on is
      # ubuntu-latest, so the platform is known and the uname dance is gone.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
