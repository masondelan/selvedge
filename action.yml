name: 'Selvedge Coverage Check'
description: 'Report the fraction of git commits with Selvedge change-event coverage, and optionally fail the build below a threshold.'
author: 'masondelan'

branding:
  icon: 'git-commit'
  color: 'blue'

inputs:
  since:
    description: 'How far back to analyse (e.g. 30d, 7d, 1y).'
    required: false
    default: '30d'
  window:
    description: 'Match window in minutes around each commit.'
    required: false
    default: '10'
  limit:
    description: 'Maximum number of commits to analyse.'
    required: false
    default: '100'
  fail-under:
    description: 'Fail the job if the coverage ratio (0-1) is below this value. Leave empty to report only.'
    required: false
    default: ''
  selvedge-version:
    description: 'pip version specifier to install, e.g. "==0.3.8". Empty installs the latest release.'
    required: false
    default: ''
  python-version:
    description: 'Python version to set up for the run.'
    required: false
    default: '3.x'
  working-directory:
    description: 'Directory to run in — where the git repo and .selvedge/ database live.'
    required: false
    default: '.'
  db-path:
    description: 'Explicit path to the Selvedge database (sets SELVEDGE_DB). Optional.'
    required: false
    default: ''

outputs:
  coverage-ratio:
    description: 'Fraction of analysed commits that have Selvedge coverage (0-1).'
    value: ${{ steps.run.outputs.coverage-ratio }}
  covered:
    description: 'Number of commits with at least one nearby Selvedge event.'
    value: ${{ steps.run.outputs.covered }}
  total:
    description: 'Number of commits analysed.'
    value: ${{ steps.run.outputs.total }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # Inputs are passed through `env:` and referenced as quoted shell
    # variables, never interpolated into the script text. `${{ }}` expansion
    # is textual and happens BEFORE the shell parses the line, so a caller
    # wiring a dynamic value into any of these — a workflow_dispatch input, a
    # workflow_call parameter — could otherwise inject commands that run with
    # THEIR GITHUB_TOKEN in scope. This action is published for third-party
    # use, so it does not trust its inputs regardless of who sets them.
    - name: Install Selvedge
      shell: bash
      env:
        SELVEDGE_VERSION_SPEC: ${{ inputs.selvedge-version }}
      run: pip install "selvedge${SELVEDGE_VERSION_SPEC}"

    - name: Run coverage check
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DB_PATH: ${{ inputs.db-path }}
        SINCE: ${{ inputs.since }}
        WINDOW: ${{ inputs.window }}
        LIMIT: ${{ inputs.limit }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -n "$DB_PATH" ]; then
          export SELVEDGE_DB="$DB_PATH"
        fi
        python "$ACTION_PATH/scripts/coverage_check.py" \
          --since "$SINCE" \
          --window "$WINDOW" \
          --limit "$LIMIT" \
          --json | tee selvedge-coverage.json
        python "$ACTION_PATH/scripts/coverage_gate.py" \
          selvedge-coverage.json "$FAIL_UNDER"
