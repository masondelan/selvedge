<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="960" height="670" role="img" aria-labelledby="title description">
  <title id="title">Where Selvedge fits</title>
  <desc id="description">Save a project decision with your coding agent through MCP or CLI. Selvedge keeps its reason, rejected approaches and revisit conditions in local SQLite. A later session retrieves the record before editing. Git, code review and observability retain their existing roles.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#1F3057" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #1F3057; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .heading { font-size: 25px; font-weight: 600; }
    .body { font-size: 21px; }
    .muted { fill: #4a5575; }
    .step { font-size: 19px; fill: #B23A2A; }
  </style>
  <rect width="960" height="670" rx="12" fill="#FAF6EC"/>
  <rect x="44" y="40" width="4" height="33" fill="#B23A2A"/>
  <text x="65" y="65" font-size="30" font-weight="500">Keep the why with your code.</text>

  <text x="46" y="138" class="mono step">01</text>
  <text x="106" y="138" class="heading">Your coding session</text>
  <text x="106" y="173" class="body">Save a choice, its reason, and what you ruled out.</text>
  <text x="106" y="205" class="body muted">Your agent calls MCP tools. You can also use the CLI.</text>

  <path d="M65 223 V259" fill="none" stroke="#1F3057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="44" y="278" width="872" height="132" rx="5" fill="#EDE5D3"/>
  <rect x="44" y="278" width="4" height="132" fill="#B23A2A"/>
  <text x="65" y="316" class="mono step">02</text>
  <text x="125" y="316" class="mono" font-size="27" font-weight="500">selvedge</text>
  <text x="125" y="352" class="body">Local decision history, organized by entity.</text>
  <text x="125" y="385" class="body muted">Reasons · rejected approaches · conditions for review</text>

  <path d="M65 428 V464" fill="none" stroke="#1F3057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="46" y="503" class="mono step">03</text>
  <text x="106" y="503" class="heading">Your next session</text>
  <text x="106" y="539" class="body">Retrieve the decision before changing the same entity.</text>
  <text x="106" y="571" class="body muted">Check whether the original constraint still applies.</text>

  <path d="M44 605 H916" stroke="#D5CDB5"/>
  <text x="44" y="641" font-size="19" class="muted">Works alongside Git history, code review, and observability.</text>
</svg>
