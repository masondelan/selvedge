name: Publish to PyPI + create GitHub Release

# Triggers when you push a version tag: git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # needed to create GitHub Releases
      id-token: write  # needed for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for changelog generation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Set version without v-prefix
        id: version
        run: echo "num=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate changelog from git log
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Selvedge ${{ github.ref_name }}
          body: |
            ## What's changed

            ${{ steps.changelog.outputs.CHANGES }}

            ---

            **Install:** `pip install selvedge==${{ steps.version.outputs.num }}`
            **PyPI:** https://pypi.org/project/selvedge/
            **Docs:** https://github.com/masondelan/selvedge/blob/main/docs/getting-started.md
          files: dist/*
          draft: false
          prerelease: false

  publish-mcp-registry:
    runs-on: ubuntu-latest
    # The registry's ownership check reads the README of the latest release
    # on PyPI, so this must only run after the PyPI publish succeeds.
    needs: publish
    permissions:
      contents: read
      id-token: write  # OIDC login to the MCP Registry (io.github.masondelan/* namespace)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Belt-and-suspenders: server.json carries the version in two places
      # (top-level and packages[0]). The version-bump checklist updates both,
      # but sync them from the tag anyway so a missed bump can't publish a
      # stale version.
      - name: Sync server.json versions from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      # PyPI can take a little while to serve a freshly uploaded release, and
      # the registry's ownership check reads pypi.org directly.
      - name: Wait for PyPI to serve the new version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for i in $(seq 1 30); do
            SERVED=$(curl -s https://pypi.org/pypi/selvedge/json | jq -r .info.version)
            if [ "$SERVED" = "$VERSION" ]; then
              echo "PyPI is serving $VERSION"
              exit 0
            fi
            echo "PyPI is serving $SERVED, waiting for $VERSION ($i/30)"
            sleep 10
          done
          echo "Timed out waiting for PyPI to serve $VERSION" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
