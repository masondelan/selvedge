name: Review context synthetic native smoke

# Temporary release validation. Remove after the recorded probe runs.
# The exact branch allowlist keeps ordinary and fork PRs outside this workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: selvedge-native-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: >-
      github.repository == 'masondelan/selvedge' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'release/native-review-context-probe' ||
       github.event.pull_request.head.ref == 'release/native-review-context-empty')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Render synthetic history without comment writes
        uses: ./actions/review-context
        with:
          token: ${{ github.token }}
          db-path: tests/fixtures/native-review-context/history.db
          limit: '10'
          budget: '2000'
          dry-run: 'true'

  comment:
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Create or refresh the synthetic probe comment
        uses: ./actions/review-context
        with:
          token: ${{ github.token }}
          db-path: tests/fixtures/native-review-context/history.db
          limit: '10'
          budget: '2000'
          dry-run: 'false'
      - name: Repeat the identical report without another write
        uses: ./actions/review-context
        with:
          token: ${{ github.token }}
          db-path: tests/fixtures/native-review-context/history.db
          limit: '10'
          budget: '2000'
          dry-run: 'false'
